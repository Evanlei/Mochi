<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
<title>Mochi app icon mockup and small-size previews</title>
<defs><symbol id="app-icon" viewBox="0 0 1024 1024">  <defs>
