name: Checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: backend
      - run: bash scripts/test-backend.sh --python-only
